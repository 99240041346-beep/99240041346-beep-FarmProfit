services:
  - type: web
    name: farmprofit
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_DEMO
        value: "1"
      - key: DEMO_EMAIL
        value: demo@farmprofit.app
      - key: DEMO_PASSWORD
        value: Demo@12345
      - key: DATABASE_URL
        fromDatabase:
          name: farmprofit-db
          property: connectionString

databases:
  - name: farmprofit-db
    databaseName: farmprofit
    user: farmprofit
